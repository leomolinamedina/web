        <main class="agua">
            <section>
                <header class="img-before portada">
                    <h2>Formularios HTMl5</h2>
                </header>
                <article>
                    <h3>Formulario de Préstamo Personal</h3>
                    <form class="form" action="../pages/enviado.html" method="get" enctype="multipart/form-data">
                        <!-- ================================= -->
                        <!-- 4. SITUACIÓN LABORAL -->
                        <!-- ================================= -->

                        <fieldset>
                            <legend>4. Situación laboral</legend>

                            <ul>
                                <li>
                                    <label for="empresa">Nombre de la empresa:</label>

                                    <!-- 
                                        PISTA:
                                        Entre 2 y 60 caracteres.
                                        Letras, números, espacios, puntos y guiones.
                                    -->
                                    <input type="text" id="empresa" name="empresa" minlength="2" maxlength="60" title="Entre 2 y 60 caracteres. Solo letras, números, espacios, puntos y guiones." pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜçÇ0-9 .\-]{2,60}" required placeholder="Senen y asociados"/>
                                </li>

                                <li>
                                    <label for="cif">CIF/NIF de la empresa:</label>

                                    <!-- 
                                        PISTA:
                                        Una letra inicial, 7 cifras y un carácter
                                        de control numérico o alfabético.
                                        Formato habitual de CIF español.
                                    -->
                                    <input type="text" id="cif" name="cif" placeholder="B12345678" maxlength="" title="Debe contener una letra inicial, 7 cifras y un carácter de control numérico o alfabético." pattern="[a-zA-Z][0-9]{7}[a-zA-Z0-9]" required/>
                                </li>

                                <li>
                                    <label for="puesto">Puesto de trabajo:</label>
                                    <!-- También podría ser un desplegable -->
                                    <select name="puesto" id="puesto" required>
                                        <option value="" selected disabled>Selecciona un puesto</option>
                                        <option value="director">Director/a</option>
                                        <option value="gerente">Gerente</option>
                                        <option value="desarrollador-web">Desarrollador/a web</option>
                                        <option value="disenador-grafico">Diseñador/a gráfico</option>
                                        <option value="tecnico-informatico">Técnico/a informático</option>
                                        <option value="otro">Otro</option>
                                    </select>
                                </li>

                                <li>
                                    <label for="antiguedad">Antigüedad (años):</label>

                                    <!-- INPUT HTML5: number -->
                                    <input type="number" id="antiguedad" name="antiguedad" title="La antigüedad debe ser un número entero igual o mayor que 0." min="1" step="1" max="80" placeholder="20" required/>
                                </li>

                                <li>
                                    <label for="salario">Salario mensual neto (€):</label>

                                    <!-- 
                                        INPUT HTML5: number.
                                        Mínimo 600 euros.
                                        Admite decimales de hasta dos cifras.
                                    -->
                                    <input type="number" id="salario" name="salario" min="600" max="24000" step="0.01" title="El salario debe estar entre 600 y 24.000 euros, con un máximo de dos decimales." value="600" required />
                                </li>

                                <li>
                                    <label for="contrato">Tipo de contrato:</label>

                                    <select id="contrato" name="contrato" required>
                                        <option value="">Selecciona...</option>
                                        <option value="practicante">Practicante</option>
                                        <option value="indefinido">Indefinido</option>
                                        <option value="temporal">Temporal</option>
                                        <option value="autonomo">Autónomo</option>
                                        <option value="funcionario">Funcionario</option>
                                        <option value="otro">Otro</option>
                                    </select>
                                </li>

                                <li>
                                    <label for="color">Color identificativo:</label>

                                    <!-- INPUT HTML5: color -->
                                    <input type="color" id="color" name="color" value="#174c70" title="Introduce un color hexadecimal válido de 6 caracteres precedido por #." required/>
                                </li>
                            </ul>
                        </fieldset>
                        <!-- ================================= -->
                        <!-- 9. BOTONES -->
                        <!-- ================================= -->

                        <fieldset>
                            <legend>9. Envío de la solicitud</legend>

                            <ul>
                                <li>
                                    <!-- INPUT CLÁSICO: submit -->
                                    <input type="submit" value="Enviar solicitud" />
                                </li>

                                <li>
                                    <!-- INPUT CLÁSICO: reset -->
                                    <input type="reset" value="Borrar formulario" />
                                </li>
                            </ul>
                        </fieldset>
                    </form>
