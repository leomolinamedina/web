<!doctype html>
<html lang="en">
    <head>
        <!-- Juego de caracteres de casi todos los idiomas humanos (incluidos ñ, tildes ...) -->
        <meta charset="utf-8" />
        <!-- Escala inicial y renderizado _responsive_ por el ancho del dispositivo -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Compatibilidad con Microsoft Explorer -->
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <!-- Indéxame NO y sígueme NO -->
        <meta name="robots" content="noIndex, noFollow" />
        <!-- Breve descripción del sitio que se verá en los resultados de búsqueda -->
        <meta name="description" content="Sitio web de prueba elaborado en el curso de Confección y Publicación de Páginas Web (IFCD0110). Unidad Formativa UF1303, Elaboración de hojas de estilos" />
        <!-- Google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Simonetta:ital,wght@0,400;0,900;1,400;1,900&display=swap" rel="stylesheet" />
        <!-- Utilícese una hoja de estilos Normalize -->
        <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css" />
        <!-- Ruta a las hojas de estilos -->
        <link rel="stylesheet" href="../assets/css/variables.css" />
        <link rel="stylesheet" href="../assets/css/tipografias.css" />
        <link rel="stylesheet" href="../assets/css/visibilidad.css" />
        <link rel="stylesheet" href="../assets/css/menu.css" />
        <link rel="stylesheet" href="../assets/css/estilos.css" />
        <link rel="stylesheet" href="../assets/css/lopd.css" />
        <link rel="stylesheet" href="../assets/css/formularios.css" />
        <!-- Título de la pestaña del navegador -->
        <title>UF1303 | Elaboración de hojas de estilos</title>
    </head>

    <body>
        <header>
            <a href="../index.html" class="link-logo" title="Página principal">
                <figure class="logo"></figure>
                <h1 class="pechado">Flex box</h1>
            </a>
        </header>
        <nav class="principal" aria-label="Navegación principal">
            <h2 class="pechado">Menú Principal</h2>
            <figure class="logo-menu"></figure>
            <input id="icon-menu" name="icon-menu" type="checkbox" />
            <label for="icon-menu" class="icon-menu" aria-label="Abrir/Cerrar menú">Menú</label>
            <ul>
                <li>
                    <a href="../index.html">Inicio</a>
                </li>
                <li>
                    <a href="#">Temas</a>
                    <ul>
                        <li>
                            <a href="textos.html">Textos</a>
                        </li>
                        <li>
                            <a href="imagenes.html">Imagenes</a>
                        </li>
                    </ul>
                </li>
                <li>
                    <a href="../legal/lopd.html">Legal</a>
                </li>
                <li>
                    <a href="contacto.html">Contacto</a>
                </li>
            </ul>
        </nav>
        <main class="agua">
            <section>
                <header class="img-before portada">
                    <h2>Contacta Con Nosotros</h2>
                </header>
                <article>
                    <h3>Formulario de contacto</h3>
                    <form action="enviado.html" method="post" class="form" id="form">
                        <fieldset>
                            <legend>Datos Personales</legend>
                            <ul>
                                <li>
                                    <label for="name">Nombre</label>
                                    <input type="text" placeholder="Tu nombre" name="name" id="name" required />
                                </li>
                                <li>
                                    <label for="email">E-mail</label>
                                    <input type="email" placeholder="Correo electrónico" name="email" id="email" required />
                                </li>
                                <li>
                                    <label for="tfno">Teléfono</label>
                                    <input type="tel" placeholder="Teléfono" name="tfno" id="tfno" />
                                </li>
                                <li>
                                    <label for="edad">Edad</label>
                                    <input type="number" placeholder="Tu edad" name="edad" id="edad" />
                                </li>
                                <li>
                                    <input type="radio" name="coche" id="coche-si" value="si" />
                                    <label for="coche-si">Si</label>
                                </li>
                                <li>
                                    <input type="radio" name="coche" id="coche-no" value="no" />
                                    <label for="coche-no">No</label>
                                </li>
                                <li>
                                    <input type="checkbox" name="acepto" id="acepto" required />
                                    <label for="acepto">
                                        Acepto el tratamiento de mis datos personales. Más información en
                                        <a href="#">Política de tratamiento de datos personales</a>
                                    </label>
                                </li>
                                <li>
                                    <label for="mensaje">Mensaje</label>
                                    <textarea placeholder="Escribe tu mensaje aquí" name="mensaje" id="mensaje" cols="30" rows="5" required></textarea>
                                </li>
                            </ul>
                        </fieldset>
                    </form>
                </article>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
